
name: Python US02 Tests

on:
  push:
    branches:
      - main
      - feature/US02-account-management

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run US02 tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
